version: "3"
networks:
  grafana-network:
    name: grafana-net
volumes:
  grafana-data:
    name: "grafana-data"
  loki-data:
    name: "loki-data"
  prometheus-data:
    name: "prometheus-data"

services:
  loki:
    image: grafana/loki:3.5.5
    container_name: loki
    command: -config.file=/etc/loki/local-config.yml
    restart: unless-stopped
    volumes:
      - ./loki-config/local-config.yml:/etc/loki/local-config.yml:ro
      - loki-data:/loki:rw
    networks:
      - grafana-network
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    command: --config.file=/prometheus-config.yml
    restart: unless-stopped
    volumes:
      - ./prometheus-config/prometheus.yml:/prometheus-config.yml:ro
      - prometheus-data:/prometheus:rw
    networks:
      - grafana-network
  grafana:
    image: grafana/grafana:11.5
    container_name: grafana
    restart: unless-stopped
    volumes:
      - ./grafana-config/grafana-provisioning.yml:/etc/grafana/provisioning/datasources/grafana-provisioning.yml:ro
      - grafana-data:/var/lib/grafana:rw
    networks:
      - grafana-network
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
  treaefik:
    image: traefik:v3.5.2
    container_name: traefik-grafana
    restart: unless-stopped
    volumes:
      - ./traefik-config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-config/traefik-routing.yml:/traefik-routing.yml:ro
      - ./traefik-config/digestUsers.txt:/digestUsers.txt:ro
    networks:
      - grafana-network
    ports:
      - "7070:7070"
    depends_on:
      grafana:
        condition: service_started
